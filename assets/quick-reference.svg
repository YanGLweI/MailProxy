<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200">
  <defs>
    <linearGradient id="quick-start-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="200" fill="url(#quick-start-gradient)" rx="8" stroke="#ffb74d" stroke-width="2"/>
  
  <!-- Title -->
  <text x="50" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e65100">
    🚀 Quick Reference for Business Apps
  </text>
  
  <!-- Connection Details Box -->
  <rect x="50" y="50" width="600" height="130" fill="white" stroke="#ffcc80" stroke-width="2" rx="6"/>
  
  <!-- SMTP Settings -->
  <g transform="translate(70, 70)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">
      SMTP Server Configuration:
    </text>
    
    <!-- Row 1 -->
    <rect x="0" y="15" width="200" height="25" fill="#e8f5e9" rx="3"/>
    <text x="10" y="32" font-family="monospace" font-size="11" fill="#1b5e20">
      Host: &lt;your-server-ip&gt;:465
    </text>
    
    <!-- Row 2 -->
    <rect x="0" y="45" width="200" height="25" fill="#e3f2fd" rx="3"/>
    <text x="10" y="62" font-family="monospace" font-size="11" fill="#1565c0">
      SSL/TLS: Enabled (Implicit)
    </text>
    
    <!-- Row 3 -->
    <rect x="0" y="75" width="200" height="25" fill="#f3e5f5" rx="3"/>
    <text x="10" y="92" font-family="monospace" font-size="11" fill="#6a1b9a">
      Auth: PLAIN or LOGIN
    </text>
    
    <!-- Row 4 - Optional STARTTLS -->
    <rect x="250" y="15" width="350" height="85" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" rx="3"/>
    <text x="260" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#424242">
      🔓 For STARTTLS-only Clients (Port 587):
    </text>
    <text x="260" y="50" font-family="monospace" font-size="10" fill="#616161">
      Host: &lt;your-server-ip&gt;:587
    </text>
    <text x="260" y="65" font-family="monospace" font-size="10" fill="#616161">
      TLS: StartTLS (Upgrade from plaintext)
    </text>
    <text x="260" y="80" font-family="Arial, sans-serif" font-size="10" fill="#757575" font-style="italic">
      Example: Veeam Backup & Replication
    </text>
  </g>
</svg>
