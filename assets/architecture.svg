<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="proxy-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4361ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a56d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backend-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3cb447;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34a03c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-gradient)" rx="10"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#212529">
    MailProxy Architecture
  </text>
  
  <!-- Business Applications Layer -->
  <g transform="translate(50, 70)">
    <rect width="180" height="90" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">
      Business Apps
    </text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#424242">
      Email Services
    </text>
    <circle cx="40" cy="65" r="8" fill="#2196f3"/>
    <text x="55" y="69" font-family="monospace" font-size="10" fill="#212529">SMTP</text>
    <circle cx="130" cy="65" r="8" fill="#2196f3"/>
    <text x="145" y="69" font-family="monospace" font-size="10" fill="#212529">SSL</text>
  </g>
  
  <!-- Arrow down -->
  <line x1="140" y1="160" x2="140" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- MailProxy Gateway -->
  <g transform="translate(280, 70)">
    <rect width="240" height="180" fill="url(#proxy-gradient)" stroke="#1a237e" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="120" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      📧 MailProxy Gateway
    </text>
    
    <!-- Port Info -->
    <rect x="15" y="45" width="210" height="25" fill="rgba(255,255,255,0.2)" rx="4"/>
    <text x="25" y="62" font-family="monospace" font-size="11" fill="white">
      🔒 Port 465 (SMTP over SSL)
    </text>
    <text x="25" y="77" font-family="monospace" font-size="10" fill="white" opacity="0.8">
      🔓 Port 587 (STARTTLS - optional)
    </text>
    
    <!-- Features -->
    <line x1="15" y1="85" x2="225" y2="85" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="25" y="102" font-family="Arial, sans-serif" font-size="11" fill="white">✓ IP Whitelist • Auth Mode</text>
    <text x="25" y="117" font-family="Arial, sans-serif" font-size="11" fill="white">✓ Auto Backend Detection</text>
    <text x="25" y="132" font-family="Arial, sans-serif" font-size="11" fill="white">✓ Hot Reload Config • Prometheus Metrics</text>
    
    <!-- Security Badge -->
    <g transform="translate(160, 140)">
      <circle cx="50" cy="15" r="12" fill="#ffeb3b" stroke="#fbc02d" stroke-width="2"/>
      <text x="50" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f57f17">🔐</text>
    </g>
  </g>
  
  <!-- Connection Arrows -->
  <g transform="translate(360, 270)">
    <line x1="40" y1="0" x2="40" y2="30" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="120" y1="0" x2="120" y2="30" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="200" y1="0" x2="200" y2="30" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Backend SMTP Servers -->
  <g transform="translate(50, 310)">
    <!-- Backend 1 -->
    <rect width="220" height="80" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <text x="110" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b5e20">
      📨 Backend SMTP Servers
    </text>
    <rect x="10" y="35" width="200" height="35" fill="white" stroke="#81c784" stroke-width="1" rx="4"/>
    <text x="20" y="52" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">• Aliyun Enterprise</text>
    <text x="20" y="67" font-family="monospace" font-size="9" fill="#666">smtp.qiye.aliyun.com:465</text>
    
    <!-- Backend 2 -->
    <rect x="270" y="35" width="220" height="35" fill="white" stroke="#81c784" stroke-width="1" rx="4"/>
    <text x="280" y="52" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">• QQ Enterprise</text>
    <text x="280" y="67" font-family="monospace" font-size="9" fill="#666">smtp.qq.com:465</text>
    
    <!-- Backend 3 -->
    <rect x="490" y="35" width="220" height="35" fill="white" stroke="#81c784" stroke-width="1" rx="4"/>
    <text x="500" y="52" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">• Others...</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 410)">
    <rect width="700" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4"/>
    <text x="10" y="18" font-family="Arial, sans-serif" font-size="10" fill="#666">📍 Proxy Listens on 465/SSL (default) and/or 587/STARTTLS (optional)</text>
  </g>
</svg>
