<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="businessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="proxyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0AD4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC971F;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family:"Segoe UI",Arial,sans-serif" font-size="20px" font-weight="bold" fill="#333">MailProxy Architecture</text>
  <text x="450" y="58" text-anchor="middle" font-family:"Segoe UI",Arial,sans-serif" font-size="12px" fill="#666">SMTP Mail Proxy Gateway</text>
  
  <!-- Business Layer -->
  <g transform="translate(50,80)">
    <rect x="0" y="0" width="220" height="120" rx="8" ry="8" fill="url(#businessGrad)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="30" rx="8" ry="8" fill="#2C3E50"/>
    <text x="15" y="20" font-family:"Segoe UI",Arial,sans-serif" font-size="14px" font-weight="bold" fill="#FFFFFF">💻 Business Applications</text>
    
    <g transform="translate(40,45)">
      <circle cx="15" cy="12" r="6" fill="#FFFFFF"/>
      <text x="30" y="17" font-family:"monospace" font-size="13px" fill="#333">App A</text>
      
      <circle cx="15" cy="32" r="6" fill="#FFFFFF"/>
      <text x="30" y="37" font-family:"monospace" font-size="13px" fill="#333">App B</text>
      
      <circle cx="15" cy="52" r="6" fill="#FFFFFF"/>
      <text x="30" y="57" font-family:"monospace" font-size="13px" fill="#333">App C</text>
    </g>
  </g>
  
  <!-- Arrow from business to proxy -->
  <g>
    <line x1="270" y1="120" x2="300" y2="140" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="280" y="115" font-family:"Arial,sans-serif" font-size="11px" fill="#666" text-anchor="middle">SMTP over SSL</text>
    <text x="280" y="128" font-family:"Arial,sans-serif" font-size="10px" fill="#999" text-anchor="middle">port:465</text>
  </g>
  
  <!-- MailProxy Layer -->
  <g transform="translate(300,80)">
    <rect x="0" y="0" width="500" height="400" rx="12" ry="12" fill="#FFF" stroke="#5CB85C" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="500" height="50" rx="12" ry="12" fill="url(#proxyGrad)"/>
    <text x="20" y="32" font-family:"Segoe UI",Arial,sans-serif" font-size="18px" font-weight="bold" fill="#FFFFFF">📧 MailProxy Gateway</text>
    
    <!-- Internal Components Grid -->
    <g transform="translate(20,70)">
      <!-- SSL/TLS Termination -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="180" height="90" rx="6" ry="6" fill="#E8F5E9" stroke="#5CB85C" stroke-width="1.5"/>
        <text x="10" y="20" font-family:"Segoe UI",Arial,sans-serif" font-size="12px" font-weight="bold" fill="#2E7D32">🔐 SSL/TLS Termination</text>
        <line x1="10" y1="25" x2="170" y2="25" stroke="#5CB85C" stroke-width="1"/>
        <text x="10" y="45" font-family:"Arial,sans-serif" font-size="10px" fill="#555">• Certificate validation</text>
        <text x="10" y="60" font-family:"Arial,sans-serif" font-size="10px" fill="#555">• Connection encryption</text>
        <text x="10" y="75" font-family:"Arial,sans-serif" font-size="10px" fill="#555">• Port:465 (SMTPS)</text>
      </g>
      
      <!-- Routing Engine -->
      <g transform="translate(210,0)">
        <rect x="0" y="0" width="270" height="90" rx="6" ry="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
        <text x="10" y="20" font-family:"Segoe UI",Arial,sans-serif" font-size="12px" font-weight="bold" fill="#1976D2">️⚙️ Routing Engine</text>
        <line x1="10" y1="25" x2="250" y2="25" stroke="#2196F3" stroke-width="1"/>
        <text x="10" y="45" font-family:"Arial,sans-serif" font-size="10px" fill="#555">• Envelope sender matching</text>
        <text x="10" y="60" font-family:"Arial,sans-serif" font-size="10px" fill="#555">• Authentication mapping</text>
        <text x="10" y="75" font-family:"Arial,sans-serif" font-size="10px" fill="#555">• IP whitelist verification</text>
      </g>
      
      <!-- Connection Pool -->
      <g transform="translate(0,110)">
        <rect x="0" y="0" width="180" height="90" rx="6" ry="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
        <text x="10" y="20" font-family:"Segoe UI",Arial,sans-serif" font-size="12px" font-weight="bold" fill="#F57C00">⏱️ Connection Pool</text>
        <line x1="10" y1="25" x2="160" y2="25" stroke="#FF9800" stroke-width="1"/>
        <text x="10" y="45" font-family:"Arial,sans-serif" font-size="10px" fill="#555">• Concurrent connections</text>
        <text x="10" y="60" font-family:"Arial,sans-serif" font-size="10px" fill="#555">• Connection timeout</text>
        <text x="10" y="75" font-family:"Arial,sans-serif" font-size="10px" fill="#555">• Graceful shutdown</text>
      </g>
      
      <!-- Message Queue -->
      <g transform="translate(210,110)">
        <rect x="0" y="0" width="270" height="90" rx="6" ry="6" fill="#E8F5E9" stroke="#5CB85C" stroke-width="1.5"/>
        <text x="10" y="20" font-family:"Segoe UI",Arial,sans-serif" font-size="12px" font-weight="bold" fill="#2E7D32">🔄 Forwarding Queue</text>
        <line x1="10" y1="25" x2="250" y2="25" stroke="#5CB85C" stroke-width="1"/>
        <text x="10" y="45" font-family:"Arial,sans-serif" font-size="10px" fill="#555">• SMTP/SMTPS relay</text>
        <text x="10" y="60" font-family:"Arial,sans-serif" font-size="10px" fill="#555">• AUTH PLAIN/LOGIN</text>
        <text x="10" y="75" font-family:"Arial,sans-serif" font-size="10px" fill="#555">• Error propagation</text>
      </g>
    </g>
  </g>
  
  <!-- Configuration Block -->
  <g transform="translate(480,500)">
    <rect x="0" y="0" width="260" height="50" rx="6" ry="6" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
    <text x="15" y="20" font-family:"Segoe UI",Arial,sans-serif" font-size="11px" font-weight="bold" fill="#37474F">⚙️ config.yaml</text>
    <text x="15" y="35" font-family:"Arial,sans-serif" font-size="9px" fill="#666">Backend accounts • Routes • Whitelist • Logging</text>
  </g>
  
  <!-- Arrows connecting components -->
  <g>
    <polygon points="270,130 280,130 280,150 290,160" fill="#2E3B4A"/>
    <polygon points="300,140 310,140 310,150 320,150" fill="#2E3B4A"/>
  </g>
  
  <!-- Routing arrow from config -->
  <g>
    <path d="M 480 530 Q 480 480 420 480 L 420 170" fill="none" stroke="#455A64" stroke-width="1.5" stroke-dasharray="4,2"/>
    <polygon points="420,165 415,170 425,170" fill="#455A64"/>
    <text x="460" y="450" font-family:"Arial,sans-serif" font-size="9px" fill="#666" transform="rotate(-90 460,450)">Route configuration</text>
  </g>
  
  <!-- Backend Services Layer -->
  <g transform="translate(200,500)">
    <rect x="0" y="0" width="220" height="50" rx="6" ry="6" fill="url(#backendGrad)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="25" rx="6" ry="6" fill="#EF6C00"/>
    <text x="15" y="17" font-family:"Segoe UI",Arial,sans-serif" font-size="11px" font-weight="bold" fill="#FFFFFF">☁️ Alibaba Cloud Enterprise Email</text>
    <text x="15" y="32" font-family:"monospace" font-size="9px" fill="#FFFFFF">smtp.qiye.aliyun.com</text>
  </g>
  
  <g transform="translate(470,500)">
    <rect x="0" y="0" width="220" height="50" rx="6" ry="6" fill="url(#backendGrad)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="25" rx="6" ry="6" fill="#EF6C00"/>
    <text x="15" y="17" font-family:"Segoe UI",Arial,sans-serif" font-size="11px" font-weight="bold" fill="#FFFFFF">📧 Other SMTP Services</text>
    <text x="15" y="32" font-family:"Arial,sans-serif" font-size="9px" fill="#FFFFFF">QQ / NetEase / Gmail / Custom</text>
  </g>
  
  <!-- Down arrows to backend -->
  <g>
    <polygon points="300,480 300,490 310,490 310,480" fill="#2E3B4A"/>
    <polygon points="510,480 510,490 520,490 520,480" fill="#2E3B4A"/>
  </g>
  
</svg>
